<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://cloudflare-dns.com https://api.ipify.org https://api64.ipify.org https://ipapi.co; frame-src 'self' data: blob:; object-src 'none'" />
  <title>SWISSNAND IT Toolbox</title>
  <link rel="icon" href="img/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="drag"></div>
      <a class="brand" href="#/">
        <img src="img/logo.svg" alt="" class="brand-logo" />
        <div class="brand-text">
          <span class="brand-name">SWISSNAND</span>
          <span class="brand-sub">IT Toolbox</span>
        </div>
      </a>
      <button class="search-trigger" id="searchTrigger" type="button">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Tool suchen …</span>
        <kbd>⌘K</kbd>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="theme-btn" id="themeBtn" type="button" title="Design wechseln"></button>
        <span class="version" id="version"></span>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="drag drag-main"></div>
      <div id="view"></div>
    </main>
  </div>

  <div class="palette" id="palette" hidden>
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="paletteInput" placeholder="Tool suchen … (z. B. base64, subnet, uuid)" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <ul class="palette-list" id="paletteList"></ul>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="vendor/qrcode_UTF8.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="js/core.js"></script>
  <script src="js/tools/encode.js"></script>
  <script src="js/tools/security.js"></script>
  <script src="js/tools/network.js"></script>
  <script src="js/tools/text.js"></script>
  <script src="js/tools/dev.js"></script>
  <script src="js/tools/time.js"></script>
  <script src="js/tools/calc.js"></script>
  <script src="js/tools/reference.js"></script>
  <script src="js/tools/system.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
