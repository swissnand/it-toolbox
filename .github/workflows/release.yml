name: macOS DMG bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: DMG bauen (Universal – Apple Silicon + Intel)
        run: npx electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: DMG als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: SWISSNAND-IT-Toolbox-dmg
          path: dist/*.dmg

      - name: GitHub Release erstellen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## SWISSNAND IT Toolbox ${{ github.ref_name }}

            **Download:** `SWISSNAND-IT-Toolbox-*-universal.dmg` unten bei *Assets* – läuft auf Apple Silicon und Intel.

            > Beim ersten Start: Rechtsklick auf die App → **Öffnen** (die App ist nicht von Apple notarisiert).
